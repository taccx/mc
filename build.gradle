plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Pinned to an exact version. A range such as '[6.0,6.2)' additionally needs
    // plugin version-range resolution, which this machine's reachable mirrors do not serve.
    id 'net.minecraftforge.gradle' version '6.0.16'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // No flatDir here on purpose, and this is the fix for a long-standing build failure.
    //
    // ForgeGradle applies its "mapped artifact" content filter to every declared
    // repository. A flatDir repository cannot accept a content filter, so with
    //
    //     flatDir { dir 'libs' }
    //
    // declared, ForgeGradle threw
    //
    //     IllegalStateException: Cannot mutate content repository descriptor
    //       'flatDir(...\libs)' after repository has been used
    //
    // from inside its own artifact resolution. Depending on which task was being
    // configured, that surfaced as
    //   * "Could not find net.minecraftforge:forge:..._mapped_official_1.20.1" during
    //     compileJava (when combined with the reobf finalizer), or
    //   * a NullPointerException in :extractSrg during reobfJar.
    //
    // The local mod jars do not need it: they are declared as plain file dependencies
    // (see the dependencies block), and ForgeGradle's deobf could never process them
    // anyway - it warned "files(...) dependencies are not deobfuscated" on every build.
    // Removing the repository costs nothing and unblocks the mapping resolution.

    // Maven Central through Aliyun. maven.minecraftforge.net and repo.maven.apache.org are
    // both unreachable from this network, and the local Clash proxy that reaches them is
    // often not running. ForgeGradle's compile classpath pulls ordinary Central artifacts
    // (jna, jsr305, java-objc-bridge, junit) and without a reachable source for those the
    // build fails before it even starts. Aliyun serves all of them.
    //
    // This covers Central only. Artifacts that live solely on the Forge maven - the mapped
    // Forge jar and the reobfuscation tool - still need the proxy or the local ForgeGradle
    // cache described in gradle.properties.
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }

    // ForgeGradle's own download cache, declared as a repository.
    //
    // The mapped Forge jar and its pom are already in that directory - it is laid out as a maven
    // repository, net/minecraftforge/forge/... with the jar and the .pom beside it - but with the
    // local proxy stopped, ForgeGradle has no repository that can serve net.minecraftforge:forge
    // and compileJava fails with "no repositories are defined", which reads as a missing file when
    // the file is in fact present and correct.
    //
    // Declaring the cache itself means the build no longer depends on the proxy being up: the
    // mapped artifact from here, the reobfuscation tool from local-maven, and ordinary Central
    // artifacts from Aliyun between them cover everything the compile classpath asks for.
    maven {
        name = 'ForgeGradleCache'
        url = file('E:/dsh/.gradle-home3/caches/forge_gradle/minecraft_user_repo')
    }

    // The reobfuscation step asks for net.minecraftforge:ForgeAutoRenamingTool:1.+ - a
    // dynamic version, so Gradle must read a maven-metadata.xml to choose a build. The tool
    // jar itself is already in ForgeGradle's own downloader cache, but the metadata is not,
    // and maven.minecraftforge.net is unreachable, so resolution failed with
    // "Could not resolve ... ForgeAutoRenamingTool_1.+_all_1".
    //
    // This directory is a small hand-made maven repository holding that cached jar and the
    // metadata for it, which is all a dynamic version needs. It contains nothing else.
    maven {
        name = 'LocalReobfTool'
        url = file('E:/dsh/local-maven')
    }

    // A flatDir repository was tried here as well, to reach ForgeGradle's reobfuscation
    // tool through the non-maven list it passes to MavenArtifactDownloader._gradle. It does
    // get that far, but ForgeGradle then applies its "mapped artifact" content filter to
    // every repository, and a flatDir repository cannot accept a content filter:
    //
    //   IllegalStateException: Cannot mutate content repository descriptor
    //     'flatDir(...)' after repository has been used
    //
    // which in turn makes the mapped Forge jar unresolvable and fails compileJava. So it is
    // deliberately absent. The clean combination is the local proxy plus no flatDir: with
    // the proxy up, ForgeGradle resolves the tool from the Forge maven normally and never
    // enters the path that registers the filter twice.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Compile against the two mods this addon extends. The jars live in ./libs
    // (copied out of the target modpack). Runtime presence is declared in
    // META-INF/mods.toml.
    //   irons_spellbooks - the spell framework (AbstractSpell, SpellRegistry, AoeEntity)
    //   traveloptics    - the Aqua school plus the Overflow / Rainfall implementations
    compileOnly fg.deobf(files('libs/irons_spellbooks-1.20.1-3.15.4.jar'))
    compileOnly fg.deobf(files('libs/traveloptics-6.3.0-1.20.1.jar'))
    runtimeOnly fg.deobf(files('libs/irons_spellbooks-1.20.1-3.15.4.jar'))
    runtimeOnly fg.deobf(files('libs/traveloptics-6.3.0-1.20.1.jar'))

    // Plain JUnit 5 for the Minecraft-free domain geometry. These tests need no game
    // runtime, which is exactly why the shell planner was kept free of Minecraft types.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Reobfuscation remaps the jar's official member names to SRG, which is what the
    // production runtime expects. It used to be unusable here because the flatDir
    // repository made ForgeGradle's own artifact resolution throw; with flatDir gone
    // (see the repositories block) the finalizer is safe again.
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Pinning ForgeGradle's reobfuscation tool to a concrete version was tried here while the
// proxy was down, to avoid the maven-metadata lookup that a dynamic version needs. It is not
// needed while the proxy is up, and it is left out so the tool resolves naturally.
