# Gradle memory: the Minecraft decompile step needs headroom.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---------------------------------------------------------------------------
# Network notes for this machine (kept here so a future build is not a mystery)
#
# These hosts are all unreachable or DNS-poisoned from this network:
#   maven.minecraftforge.net, repo.maven.apache.org, plugins.gradle.org
# A local proxy on 127.0.0.1:7890 reaches them when it is running; those settings are
# commented out below and can be restored when the proxy is up:
#
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7890
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7890
#
# The local Clash proxy on 127.0.0.1:7890 makes the hosts above reachable. It is enabled
# here while it is running; comment these out again when it is stopped, because leaving them
# pointing at a dead proxy makes every request - including to reachable mirrors - fail with
# "Connection refused" and the build then reports a confusing missing-artifact error.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.net.minecraftforge.gradle.check.certs=false

