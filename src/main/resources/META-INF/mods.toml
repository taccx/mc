modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Iron's Spellbooks provides the spell framework (AbstractSpell, SpellRegistry, MagicData)
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[1.20.1-3.15.0,)"
    ordering="AFTER"
    side="BOTH"

# T.O Magic 'n Extras provides the Aqua school and the Overflow / Rainfall spells
[[dependencies.${mod_id}]]
    modId="traveloptics"
    mandatory=true
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"
