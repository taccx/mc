distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 8.1.1, not the MDK's 8.8: ForgeGradle 6.0.16 fails to configure against 8.8 with
# "Could not find 'versionParser'". See README.md.
#
# Note the wrapper still has to fetch this distribution from services.gradle.org, which is
# unreachable here without the local proxy, so in practice this project is built with the
# unpacked distribution at E:\dsh\.skill-src\forge\gradle-dist\gradle-8.1.1 instead.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
